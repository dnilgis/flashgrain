# One-time look at flashgrains.com (DTN) to find the bid portal's links and embed code.
# Prints filtered lines to the log only; commits nothing. Delete after use.
name: probe-portal
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch DTN pages and print portal-related markup
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in "https://www.flashgrains.com/" "https://www.flashgrains.com/index.cfm?show=11&mid=3" "https://www.flashgrains.com/index.cfm"; do
            echo "=================== $u"
            curl -sSL -m 30 -A "$UA" -D /tmp/h -o /tmp/p.html "$u" || true
            grep -i -E '^(HTTP|location|x-frame-options|content-security-policy)' /tmp/h || true
            echo "--- bytes: $(wc -c < /tmp/p.html)"
            echo "--- links/scripts/iframes mentioning portal/offer/login/widget/account/dtn:"
            grep -o -i -E '<(a|iframe|script|form|link)[^>]*>' /tmp/p.html | grep -i -E 'portal|offer|login|sign|widget|account|dtn|show=|mid=' | sed 's/^[ \t]*//' | sort -u | head -150
            echo "--- nav link texts:"
            grep -o -i -E '<a [^>]*href="[^"]*"[^>]*>[^<]{1,60}</a>' /tmp/p.html | sed 's/^[ \t]*//' | sort -u | head -120
          done
          # follow any portal-looking links found on the home page, one level
          grep -o -i -E 'href="[^"]*(portal|offer|login|account)[^"]*"' /tmp/p.html | sed 's/href="//;s/"$//' | sort -u | head -8 > /tmp/links || true
          while read -r l; do
            case "$l" in http*) u="$l";; /*) u="https://www.flashgrains.com$l";; *) u="https://www.flashgrains.com/$l";; esac
            echo "=================== follow $u"
            curl -sSL -m 30 -A "$UA" -D /tmp/h -o /tmp/q.html "$u" || true
            grep -i -E '^(HTTP|location|x-frame-options|content-security-policy)' /tmp/h || true
            grep -o -i -E '<(a|iframe|script|form)[^>]*>' /tmp/q.html | grep -i -E 'portal|offer|login|widget|dtn|action=' | sort -u | head -60
          done < /tmp/links
