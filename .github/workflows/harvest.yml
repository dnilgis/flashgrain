name: harvest bids

# Reads DTN, writes data/bids.json when prices change, plus an hourly heartbeat
# so the site can tell "quiet market" from "harvester down".
# cron-job.org triggers workflow_dispatch every 10 minutes as the main clock (see README).
# GitHub's own schedule below is an hourly backup only; GitHub runs it late or skips it under load.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and decode DTN bids
        id: bids
        run: python tools/harvest.py
      - name: Reference bids on DTN boards (Northside, Loyal)
        id: refs_dtn
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python tools/harvest.py --refs
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      - name: Reference bids on Bushel boards (Ace Ethanol, Stanley)
        id: refs_bushel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node tools/refs_bushel.mjs
      # feed/<yard>.json: the posted cash bids as a feed (emmert-cash-bids/2), read by
      # dnilgis/bids the same way it reads Badger Grain's. Computed by site.js's own
      # money(), so it matches the public page to the cent. See tools/feed.mjs.
      - name: Selftest the feed builder
        if: ${{ !cancelled() }}
        run: node tools/feed.mjs --selftest
      - name: Write the bids feed
        if: ${{ !cancelled() }}
        run: node tools/feed.mjs
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "flashgrain-harvest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json data/refs feed
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "bids $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
